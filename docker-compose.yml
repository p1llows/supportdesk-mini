services:
  mysql:
    image: mysql:8.0
    container_name: supportdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-supportdesk_mini}
      MYSQL_USER: ${DB_USERNAME:-supportdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - supportdesk_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: supportdesk_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-supportdesk_mini}
      DB_USERNAME: ${DB_USERNAME:-supportdesk}
      DB_PASSWORD: ${DB_PASSWORD:-secret_dev_pass}
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - supportdesk_net
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: supportdesk_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - supportdesk_net
    depends_on:
      - app

networks:
  supportdesk_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_vendor:
    driver: local
  frontend_node_modules:
    driver: local
